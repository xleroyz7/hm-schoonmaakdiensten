<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Pagina niet gevonden | HM Schoonmaakdiensten</title>
  <link rel="icon" href="/assets/img/favicon-purple.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .notfound {
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: 32px 20px;
      background: var(--paper, #f5f6f8);
    }
    .notfound__card {
      width: min(560px, 100%);
      padding: clamp(32px, 6vw, 56px) clamp(24px, 5vw, 44px);
      border: 1px solid var(--line, #e4e7ee);
      border-radius: 20px;
      background: var(--surface, #fff);
      box-shadow: var(--shadow-md, 0 18px 50px rgba(10, 17, 32, 0.1));
      text-align: center;
    }
    .notfound__mark {
      width: auto;
      height: 46px;
      margin: 0 auto 24px;
    }
    .notfound h1 {
      margin-top: 12px;
      font-family: var(--font-display, Archivo, sans-serif);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.03em;
      color: #1d283e;
    }
    .notfound p {
      max-width: 42ch;
      margin: 18px auto 0;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--ink-2, #4a556b);
    }
    .notfound .btn {
      margin-top: 26px;
    }
  </style>
</head>
<body>
  <main class="notfound">
    <div class="notfound__card">
      <img class="notfound__mark" src="/assets/img/hm-mark-purple.png" width="507" height="279" alt="HM Schoonmaakdiensten">
      <span class="kicker">404</span>
      <h1>Deze pagina bestaat niet.</h1>
      <p>De link is verouderd of er zit een typefout in. Ga terug naar de homepage of vraag direct een offerte aan.</p>
      <a class="btn btn--primary" href="/">Terug naar home</a>
    </div>
  </main>
</body>
</html>
